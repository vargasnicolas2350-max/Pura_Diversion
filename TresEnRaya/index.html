<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Tres en Raya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-juego">
    <h2>Tres en Raya</h2>
    <div id="turno" class="texto-turno">Turno de: <span>❌</span></div>
    
    <div class="tablero" id="tablero">
      <button class="celda" data-index="0"></button>
      <button class="celda" data-index="1"></button>
      <button class="celda" data-index="2"></button>
      <button class="celda" data-index="3"></button>
      <button class="celda" data-index="4"></button>
      <button class="celda" data-index="5"></button>
      <button class="celda" data-index="6"></button>
      <button class="celda" data-index="7"></button>
      <button class="celda" data-index="8"></button>
    </div>

    <button id="btn-reiniciar" class="btn-reiniciar">Reiniciar Juego</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
